name: Deploy to GitHub Pages

# In the repo: Settings > Pages > Source = "GitHub Actions".
# Action majors checked Nov 2026.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            relay/package-lock.json
      - run: npm ci
      # Tests cover the app and the relay logic (relay/src/core.test.ts). A failure stops the deploy.
      - run: npm test
      # Relay typecheck. --ignore-scripts skips the local Workers runtime download, which typechecking doesn't need.
      - run: npm ci --prefix relay --ignore-scripts
      - run: npm run typecheck --prefix relay
      - run: npm run build
        env:
          # Relay address, set under Settings > Secrets and variables > Actions > Variables. Not a secret.
          VITE_RELAY_URL: ${{ vars.RELAY_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
