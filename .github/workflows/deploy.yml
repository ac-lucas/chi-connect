name: Deploy to GitHub Pages

# In the repo: Settings > Pages > Source = "GitHub Actions".
# Hardening: actions pinned to full commit SHAs (version in the comment; Dependabot proposes updates), no install
# scripts, no stored git credentials, and the Pages/OIDC permissions only on the job that deploys.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            relay/package-lock.json
      # --ignore-scripts: no dependency gets to run code at install time.
      - run: npm ci --ignore-scripts
      # Tests cover the app and the relay logic (relay/src/core.test.ts). A failure stops the deploy.
      - run: npm test
      - run: npm ci --prefix relay --ignore-scripts
      - run: npm run typecheck --prefix relay
      - run: npm run build
        env:
          # Relay address, set under Settings > Secrets and variables > Actions > Variables. Not a secret.
          VITE_RELAY_URL: ${{ vars.RELAY_URL }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
